# ros2_control / Gazebo Sim controller configuration for the test_no_casters.urdf.xacro
# diagnostic robot (base_link + 2 drive wheels only, no casters, no sensors).
#
# Separate from amr_ros_dg_controllers.yaml because that file's joint_state_broadcaster
# lists the caster joints too - which don't exist on this stripped-down test robot and
# would make joint_state_broadcaster fail to configure.
#
# wheel_separation / wheel_radius / speed limits are identical to the real robot's config
# (see config/amr_ros_dg_controllers.yaml for provenance).

controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.579
    wheel_radius: 0.075

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    # diff_drive_controller on ROS 2 Jazzy always subscribes with TwistStamped regardless of
    # this flag - see scripts/wasd_teleop.py, which publishes TwistStamped to match.
    use_stamped_vel: false

    linear.x.max_velocity: 0.6
    linear.x.min_velocity: -0.6
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0
